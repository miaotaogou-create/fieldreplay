[package]
name = "fieldreplay-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "FieldReplay 原生录放引擎：UDP/串口/TCP/MQTT 录制 / .fcap 写读 / 按时间轴重放"
readme = "README.md"

[lib]
name = "fieldreplay_engine"
path = "src/lib.rs"

[[bin]]
name = "fieldreplay-engine"
path = "src/main.rs"

[dependencies]
# E9b：MQTT TLS（纯 Rust；ring 便于 Windows 编译）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "1"

[profile.release]
lto = true
codegen-units = 1
